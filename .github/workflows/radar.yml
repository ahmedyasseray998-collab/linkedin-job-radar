name: LinkedIn Job Radar

# Lossless-review workflow: pinned dependencies, verified upstream patching, unit tests, live scan.
# Full-candidate validation re-runs every recent card through the review queue without relevance rejection.
on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'radar_v5.py'
      - 'radar_multilane.py'
      - 'queries.json'
      - 'patch_upstream.py'
      - 'test_radar.py'
      - 'github_urgent_alert.py'
      - '.github/workflows/radar.yml'
  push:
    branches: [main]
    paths:
      - '.radar_trigger'
      - 'radar_v5.py'
      - 'radar_multilane.py'
      - 'queries.json'
      - 'patch_upstream.py'
      - 'test_radar.py'
      - 'github_urgent_alert.py'
      - '.github/workflows/radar.yml'

permissions:
  contents: write
  issues: write

concurrency:
  group: linkedin-job-radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout radar
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: radar
          fetch-depth: 0

      - name: Refresh radar checkout to latest main
        if: github.event_name != 'pull_request'
        working-directory: radar
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Checkout pinned LinkedIn search implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: MadsLorentzen/ai-job-search
          ref: 79cd383e58f0af7948c7c6462a3a289e9b67421e
          path: upstream

      - name: Patch and verify pinned LinkedIn CLI
        working-directory: radar
        run: |
          set -euo pipefail
          python3 patch_upstream.py ../upstream

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Validate patched LinkedIn CLI
        run: |
          set -euo pipefail
          bun run upstream/.agents/skills/linkedin-search/cli/src/cli.ts search --help >/dev/null

      - name: Run radar unit tests
        working-directory: radar
        run: |
          set -euo pipefail
          python3 -m unittest -v test_radar.py
          python3 -m py_compile github_urgent_alert.py

      - name: Run live LinkedIn scan
        if: github.event_name != 'pull_request'
        working-directory: radar
        run: |
          set -euo pipefail
          python3 radar_multilane.py --cli ../upstream/.agents/skills/linkedin-search/cli/src/cli.ts

      - name: Persist state, durable queue, and latest results
        if: github.event_name != 'pull_request'
        working-directory: radar
        run: |
          set -euo pipefail
          git config user.name "linkedin-job-radar[bot]"
          git config user.email "linkedin-job-radar[bot]@users.noreply.github.com"
          git add state/seen.json state/lane_health.json output/latest.json output/pending_runs.json output/runs output/delivery
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "radar: update $(date -u +'%Y-%m-%dT%H:%MZ')"
            git pull --rebase origin main
            git push origin main
          fi


      - name: Publish immediate broad GitHub alert
        if: github.event_name != 'pull_request'
        continue-on-error: true
        working-directory: radar
        env:
          GH_TOKEN: ${{ github.token }}
          RADAR_ALERT_ISSUE: "5"
        run: |
          set -euo pipefail
          alert_file="$(mktemp)"
          python3 github_urgent_alert.py --latest output/latest.json --pending output/pending_runs.json --output "$alert_file"
          if [ ! -s "$alert_file" ]; then
            echo "No new candidates; no immediate alert needed."
            exit 0
          fi
          gh issue comment "$RADAR_ALERT_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$alert_file"

      - name: Signal completed scan
        if: github.event_name != 'pull_request'
        working-directory: radar
        env:
          RADAR_EVENT_BRANCH: radar-events
        run: |
          set -euo pipefail
          run_id="$(python3 - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("output/latest.json").read_text(encoding="utf-8"))
          print(payload.get("run_id", ""))
          PY
          )"
          if [ -z "$run_id" ]; then
            echo "No run ID available; skipping completion signal."
            exit 0
          fi

          git fetch origin "$RADAR_EVENT_BRANCH"
          git switch --detach "origin/$RADAR_EVENT_BRANCH"
          printf '%s\n' "$run_id" > .radar_event
          git add .radar_event
          if git diff --cached --quiet; then
            echo "Completion signal already current."
          else
            git config user.name "linkedin-job-radar[bot]"
            git config user.email "linkedin-job-radar[bot]@users.noreply.github.com"
            git commit -m "radar event: $run_id"
            git push origin "HEAD:$RADAR_EVENT_BRANCH"
          fi
