name: LinkedIn Job Radar

on:
  schedule:
    - cron: '35 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: One-off scan scope; scheduled scans remain normal
        type: choice
        options: [normal, egypt_48h]
        default: normal
  pull_request:
    branches: [main]
    paths: ['*.py', 'queries*.json', '.gitignore', '.github/workflows/*.yml']
  push:
    branches: [main]
    paths: ['.radar_trigger']

permissions:
  contents: write

concurrency:
  group: linkedin-job-radar-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'live' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout radar
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: radar
          fetch-depth: 0
      - name: Refresh radar checkout to latest main
        if: github.event_name != 'pull_request'
        working-directory: radar
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
      - name: Checkout pinned LinkedIn search implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: MadsLorentzen/ai-job-search
          ref: 93fb0e6c474eac50f8ee9c239fdcf2c73c4be383
          path: upstream
      - name: Patch and verify pinned LinkedIn CLI
        working-directory: radar
        run: python3 patch_upstream.py ../upstream
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Validate patched LinkedIn CLI
        run: bun run upstream/.agents/skills/linkedin-search/cli/src/cli.ts search --help >/dev/null
      - name: Run radar unit tests
        working-directory: radar
        run: python3 -m unittest discover -v
      - name: Preserve pre-scan recovery snapshot
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: radar-before-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            radar/output/runs/
            radar/output/pending_runs.json
            radar/state/reported_runs.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Run live LinkedIn scan and target GPT queue
        if: github.event_name != 'pull_request'
        working-directory: radar
        env:
          RADAR_MODE: ${{ github.event_name == 'push' && 'trigger' || inputs.mode || 'normal' }}
        run: |
          set -euo pipefail
          python3 radar_pipeline_v16.py --cli ../upstream/.agents/skills/linkedin-search/cli/src/cli.ts --mode "$RADAR_MODE"
      - name: Preserve scan evidence as short-retention artifacts
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: radar-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            radar/output/runs/
            radar/output/.pipeline_v13/
            radar/output/.pipeline_v14/
            radar/output/latest.json
            radar/output/egypt_catchup.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore
      - name: Persist state and reconcile latest GPT acknowledgements
        if: github.event_name != 'pull_request'
        working-directory: radar
        run: |
          set -euo pipefail
          git config user.name "linkedin-job-radar[bot]"
          git config user.email "linkedin-job-radar[bot]@users.noreply.github.com"
          git rm -r --cached --ignore-unmatch output/.pipeline_v13 output/.pipeline_v14
          python3 radar_maintenance_v16.py
          git add -A -- state output
          made_commit=0
          if ! git diff --cached --quiet; then
            git commit -m "radar: update $(date -u +'%Y-%m-%dT%H:%MZ')"
            made_commit=1
          fi
          for attempt in 1 2 3; do
            git pull --rebase origin main
            python3 radar_maintenance_v16.py --ack
            git add -A -- state output
            if ! git diff --cached --quiet; then
              if [ "$made_commit" -eq 1 ]; then
                git commit --amend --no-edit
              else
                git commit -m "radar: reconcile acknowledgements"
                made_commit=1
              fi
            fi
            if [ "$made_commit" -eq 0 ]; then
              exit 0
            fi
            if git push origin HEAD:main; then
              echo "Published radar state successfully to main."
              exit 0
            fi
            echo "Push raced with another update; retrying $attempt."
          done
          echo "Failed to publish reconciled radar state." >&2
          exit 1
