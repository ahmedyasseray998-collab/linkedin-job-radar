name: Reconcile Radar Acknowledgements
on:
  push:
    branches: [main]
    paths: ['state/reported_runs.json', 'state/manual_backlog_receipts.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: linkedin-job-radar-live
  cancel-in-progress: false
jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - name: Refresh to latest main before any mutation
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
      - name: Validate acknowledgement reconciliation
        run: python3 -m unittest discover -v
      - name: Preserve pre-cleanup recovery snapshot
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: radar-ack-before-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/runs/
            output/pending_runs.json
            state/reported_runs.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Promote receipts, clean pending queue and refresh status
        run: python3 radar_maintenance_v16.py --ack
      - name: Publish reconciled queue
        run: |
          set -euo pipefail
          git config user.name "linkedin-job-radar[bot]"
          git config user.email "linkedin-job-radar[bot]@users.noreply.github.com"
          git rm -r --cached --ignore-unmatch output/.pipeline_v13 output/.pipeline_v14
          made_commit=0
          git add -A -- state output
          if ! git diff --cached --quiet; then
            git commit -m "radar: reconcile reviewer acknowledgements"
            made_commit=1
          fi
          for attempt in 1 2 3; do
            git pull --rebase origin main
            python3 radar_maintenance_v16.py --ack
            git add -A -- state output
            if ! git diff --cached --quiet; then
              if [ "$made_commit" -eq 1 ]; then
                git commit --amend --no-edit
              else
                git commit -m "radar: reconcile reviewer acknowledgements"
                made_commit=1
              fi
            fi
            if [ "$made_commit" -eq 0 ]; then
              exit 0
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Acknowledgement push raced; retrying $attempt."
          done
          echo "Failed to publish reconciled acknowledgement state." >&2
          exit 1
